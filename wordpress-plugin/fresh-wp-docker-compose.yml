version: '3.8'

services:
  fresh-db:
    image: mysql:8.0
    container_name: fresh-wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - fresh_db_data:/var/lib/mysql
    networks:
      - fresh-wp-network

  fresh-wordpress:
    image: wordpress:latest
    container_name: fresh-wordpress-site
    restart: unless-stopped
    ports:
      - "3008:80"
    environment:
      WORDPRESS_DB_HOST: fresh-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./heiwah.zip:/tmp/heiwah.zip
      - fresh_wp_data:/var/www/html
    depends_on:
      - fresh-db
    networks:
      - fresh-wp-network

volumes:
  fresh_db_data:
  fresh_wp_data:

networks:
  fresh-wp-network:
    driver: bridge
